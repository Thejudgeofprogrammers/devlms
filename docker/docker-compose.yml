services:
  start-frontend:
    container_name: start-frontend
    build:
      context: ../start-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    env_file:
      - ../start-frontend/.env.production
    depends_on:
      - api-gateway

  service-frontend:
    container_name: service-frontend
    build:
      context: ../service-frontend
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    env_file:
      - ../service-frontend/.env.production
    depends_on:
      - api-gateway

  api-gateway:
    container_name: api-gateway
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ../api-gateway/.env
    networks:
      - cust_network
    volumes:
      - ./uploads:/app/uploads

  wc-gateway:
    container_name: wc-gateway
    build:
      context: ../wc-gateway
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    env_file:
      - ../wc-gateway/.env
    networks:
      - cust_network

  # nginx:
  #   image: nginx:latest
  #   container_name: nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   networks:
  #     - cust_network

  postgres_server:
    image: postgres:latest
    container_name: postgres_server
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=devlms
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    networks:
      - cust_network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data/redis_data:/data
    networks:
      - cust_network

  mongodb:
    image: mongo:5.0
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ../data/common/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - cust_network
    command: ["--replSet", "rs0"]
    
volumes:
  postgres_data:
  redis_data:
  mongodb_data:

networks:
  cust_network:
    driver: bridge